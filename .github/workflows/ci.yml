name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    name: Lua syntax and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - name: Syntax check
        run: find . -type f -name "*.lua" -not -path "./ui/*" -not -path "./.lua/*" -not -path "./.luarocks/*" -print0 | xargs -0 -n1 luac -p
      - name: Tests
        run: lua tests/lua/run.lua

  ui:
    name: UI typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
